<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
        }

        #notification {
            font-weight: bold;
            margin-bottom: 10px;
            display: none;
        }

        ul {
            padding: 0;
        }

        li {
            list-style-type: none;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #ccc;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        button {
            margin-left: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>My To-Do List</h2>
    <div id="notification"></div>

    <input type="text" id="taskInput" placeholder="Enter a task...">
    <button onclick="addTask()">Add Task</button>

    <p>Tasks Remaining: <span id="taskCount">0</span></p>

    <ul id="taskList"></ul>

    <script>
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        const taskCount = document.getElementById('taskCount');
        const notification = document.getElementById('notification');

        function addTask() {
            let text = taskInput.value.trim();

            if (text === '') {
                showNotification("Please enter a task first!", "red");
                return;
            }

            let li = document.createElement('li');
            let span = document.createElement('span');
            span.innerText = text;

            let doneBtn = document.createElement('button');
            doneBtn.innerText = 'Done';
            doneBtn.onclick = function() {
                span.classList.toggle('completed');
                showNotification("Task status updated!", "green");
                updateCount();
            };

            let deleteBtn = document.createElement('button');
            deleteBtn.innerText = 'Delete';
            deleteBtn.onclick = function() {
                li.remove();
                showNotification("Task deleted!", "red");
                updateCount();
            };

            li.appendChild(span);
            li.appendChild(doneBtn);
            li.appendChild(deleteBtn);
            taskList.appendChild(li);

            taskInput.value = '';
            showNotification("Task added successfully!", "green");
            updateCount();
        }

        function updateCount() {
            let totalTasks = taskList.querySelectorAll('li').length;
            let completedTasks = taskList.querySelectorAll('.completed').length;
            
            taskCount.innerText = totalTasks - completedTasks;
        }

        function showNotification(message, color) {
            notification.innerText = message;
            notification.style.color = color;
            notification.style.display = "block";

            setTimeout(function() {
                notification.style.display = "none";
            }, 2000);
        }
    </script>
</body>
</html>
